events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/llhelper;
        index index.html;

        # Keep the browser and API on one origin. With no trailing slash on
        # proxy_pass, Nginx preserves the complete /api/... request path.
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Backend AI generation allows requests lasting up to 120 seconds.
            proxy_connect_timeout 5s;
            proxy_read_timeout 130s;
            proxy_send_timeout 130s;
        }

        # Missing chunks must be a real 404 rather than the SPA fallback.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # React Router direct URLs return the SPA shell.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
