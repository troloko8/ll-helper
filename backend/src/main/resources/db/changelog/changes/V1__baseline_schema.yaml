databaseChangeLog:
  - changeSet:
      id: V1-1
      author: llhelper
      comment: Create auth_users table
      changes:
        - createTable:
            tableName: auth_users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: auth_users_pkey
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_auth_users_email
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(255)
                  defaultValue: 'USER'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_login_at
                  type: TIMESTAMP

  - changeSet:
      id: V1-2
      author: llhelper
      comment: Create users table
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: users_pkey
                    nullable: false
              - column:
                  name: auth_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_auth_user_id
                    foreignKeyName: fk_users_auth_user
                    referencedTableName: auth_users
                    referencedColumnNames: id
              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_username
              - column:
                  name: native_language
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_language
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: avatar_url
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: ui_language
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: users
            indexName: idx_user_auth
            columns:
              - column:
                  name: auth_user_id

  - changeSet:
      id: V1-3
      author: llhelper
      comment: Create decks table
      changes:
        - createTable:
            tableName: decks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: decks_pkey
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: source_language
                  type: VARCHAR(255)
                  defaultValue: ''
                  constraints:
                    nullable: false
              - column:
                  name: target_language
                  type: VARCHAR(255)
                  defaultValue: ''
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_decks_owner
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false

  - changeSet:
      id: V1-4
      author: llhelper
      comment: Create cards table
      changes:
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: cards_pkey
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deck_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cards_deck
                    referencedTableName: decks
                    referencedColumnNames: id
              - column:
                  name: definition
                  type: TEXT
              - column:
                  name: examples
                  type: TEXT[]
              - column:
                  name: synonyms
                  type: TEXT[]
              - column:
                  name: translation
                  type: VARCHAR(255)

  - changeSet:
      id: V1-5
      author: llhelper
      comment: Create user_deck_progress table
      changes:
        - createTable:
            tableName: user_deck_progress
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: user_deck_progress_pkey
                    nullable: false
              - column:
                  name: deck_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: last_studied_at
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(255)
                  defaultValue: 'ACTIVE'
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_deck_progress
            baseColumnNames: deck_id
            constraintName: fk_udp_deck
            referencedTableName: decks
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT
        - sql:
            dbms: postgresql
            sql: ALTER TABLE user_deck_progress ADD CONSTRAINT chk_user_deck_progress_status CHECK (status IN ('ACTIVE', 'PAUSED', 'ARCHIVED'))

  - changeSet:
      id: V1-6
      author: llhelper
      comment: Create user_card_progress table
      changes:
        - createTable:
            tableName: user_card_progress
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: user_card_progress_pkey
                    nullable: false
              - column:
                  name: card_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: correct_streak
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: difficulty_level
                  type: INTEGER
              - column:
                  name: last_reviewed_at
                  type: TIMESTAMP
              - column:
                  name: next_review_at
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(255)
                  defaultValue: 'NEW'
                  constraints:
                    nullable: false
              - column:
                  name: times_correct
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: times_seen
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: times_wrong
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_deck_progress_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_card_progress
            baseColumnNames: card_id
            constraintName: fk_ucp_card
            referencedTableName: cards
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: user_card_progress
            baseColumnNames: user_deck_progress_id
            constraintName: fk_ucp_user_deck_progress
            referencedTableName: user_deck_progress
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT
        - sql:
            dbms: postgresql
            sql: ALTER TABLE user_card_progress ADD CONSTRAINT chk_user_card_progress_status CHECK (status IN ('NEW', 'LEARNING', 'REVIEWING', 'MASTERED'))
        - createIndex:
            tableName: user_card_progress
            indexName: idx_ucp_user_deck
            columns:
              - column:
                  name: user_deck_progress_id
              - column:
                  name: status
        - createIndex:
            tableName: user_card_progress
            indexName: idx_ucp_user_card
            unique: true
            columns:
              - column:
                  name: user_id
              - column:
                  name: card_id
