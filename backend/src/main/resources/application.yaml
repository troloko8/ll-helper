#    name: backend

spring:
  application:
    name: LLHelper

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/LL_Helper}
    username: ${DB_USERNAME:troloko}
    password: ${DB_PASSWORD:1111}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true

jwt:
  secret: ${JWT_SECRET:default-dev-secret-must-be-32-chars-long}
  expiration: ${JWT_EXPIRATION:86400000}

ai:
  provider: openai
  request-timeout-seconds: 120
  max-requests-per-second: 10
  max-tokens-per-request: 4000
  max-bulk-size: 100
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}